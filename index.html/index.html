<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priyanka Web</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
}

/* HEADER */
header{
    background:#131921;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 40px;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.nav-buttons button{
    padding:8px 15px;
    margin-left:10px;
    border:none;
    cursor:pointer;
    border-radius:4px;
}

.login{
    background:white;
    color:#131921;
}

.signup{
    background:#febd69;
    color:black;
}

/* HERO SECTION */
.hero{
    text-align:center;
    padding:80px 20px;
    background:linear-gradient(to right,#1f4037,#99f2c8);
    color:white;
}

.hero h1{
    font-size:40px;
    margin-bottom:20px;
}

.hero p{
    font-size:18px;
    margin-bottom:30px;
}

.hero button{
    padding:12px 25px;
    border:none;
    background:#131921;
    color:white;
    cursor:pointer;
    border-radius:5px;
}

/* FOOTER */
footer{
    background:#131921;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:50px;
}

/* RESPONSIVE */
@media(max-width:768px){
    header{
        flex-direction:column;
        gap:10px;
    }

    .hero h1{
        font-size:28px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Pri_Taj</div>
    <div class="nav-buttons">
        <button class="login">Login</button>
        <button class="signup">Sign Up</button>
    </div>
</header>

<section class="hero">
    <h1>Welcome to My Website 🚀</h1>
    <p>Modern Responsive Website using HTML & CSS</p>
    <button>Explore More</button>
</section>

<footer>
    © 2026 Priyanka B K | All Rights Reserved
</footer>

</body>
</html>
